name: Temporary Chess.com public-data export

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download temporary exporter
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/MarcusAnzengruber/hydra/chess-export-20260830/tools/chesscom_export.py \
            --output /tmp/chesscom_export.py

      - name: Fetch and validate Chess.com public data
        env:
          CHESS_USERNAME: marcusanz
          OUTPUT_DIR: export
        run: python /tmp/chesscom_export.py

      - name: Show export inventory
        run: |
          du -sh export
          find export -type f -printf '%s %p\n' | sort -n

      - name: Upload export bundle
        uses: actions/upload-artifact@v4
        with:
          name: chesscom-marcusanz-export
          path: export/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
